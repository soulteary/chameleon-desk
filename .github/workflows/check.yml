name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    env:
      CHAMELEON_TEST_C_REQUIRED: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.22.x'
          - os: ubuntu-latest
            go: '1.27.x'
          - os: macos-latest
            go: '1.27.x'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Install Linux recovery test dependencies
        if: runner.os == 'Linux'
        run: |
          if ! dpkg -s liblzma-dev >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes liblzma-dev
          fi
      - name: Install macOS recovery test dependencies
        if: runner.os == 'macOS'
        run: |
          if ! brew list --versions xz >/dev/null 2>&1; then
            brew install xz
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: ./scripts/check.sh
