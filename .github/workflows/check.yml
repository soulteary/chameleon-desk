name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ble-bridge:
    name: BLE bridge (${{ matrix.os }}, cgo disabled)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: '0'
      CHAMELEON_TEST_PORT: ''
      CHAMELEON_TEST_NO_CARD: ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/ble_bridge/requirements.txt
      - run: python -m pip check
      - run: python -c "from bleak import BleakClient, BleakScanner"
      - run: go mod download
      - name: Check Go dependencies for native cgo code
        shell: bash
        run: |
          cgo_packages=$(CGO_ENABLED=1 go list -mod=readonly -deps -f '{{if not .Standard}}{{if .CgoFiles}}{{.ImportPath}}{{end}}{{end}}' ./cmd/chameleon)
          if [ -n "$cgo_packages" ]; then
            echo "Non-standard Go packages require cgo: $cgo_packages" >&2
            exit 1
          fi
      # Existing recovery fixtures require a POSIX shell and file semantics.
      # Windows still builds and runs the CLI through the bridge below.
      - name: Run existing Go tests on Unix
        if: runner.os != 'Windows'
        run: go test -mod=readonly ./...
      - run: go build -mod=readonly -trimpath -o chameleon-nocgo.exe ./cmd/chameleon
      - run: ./chameleon-nocgo.exe version
      - name: Run offline bridge, CLI and Web integration tests
        env:
          CHAMELEON_BRIDGE_TEST_BINARY: chameleon-nocgo.exe
        run: python -m unittest discover -s tools/ble_bridge -v
  browser-library:
    name: Browser library persistence (Chromium)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: go mod download
      - run: |
          mkdir -p reports
          go build -mod=readonly -trimpath -o reports/chameleon-browser ./cmd/chameleon
      - name: Verify reload and browser/server restart recovery
        env:
          CHAMELEON_WEBUI_TEST_BINARY: reports/chameleon-browser
        run: npm run test:browser
  offline:
    name: Offline checks (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    env:
      CHAMELEON_TEST_C_REQUIRED: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.22.x'
          - os: ubuntu-latest
            go: '1.27.x'
          - os: macos-latest
            go: '1.27.x'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go mod download
      - name: Install Linux recovery test dependencies
        if: runner.os == 'Linux'
        run: |
          if ! dpkg -s liblzma-dev libssl-dev >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes liblzma-dev libssl-dev
          fi
      - name: Install macOS recovery test dependencies
        if: runner.os == 'macOS'
        run: |
          for package in xz openssl@3; do
            if ! brew list --versions "$package" >/dev/null 2>&1; then
              brew install "$package"
            fi
          done
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: ./scripts/check.sh
