name: Set up Go with isolated build caches
description: Restore module and build caches without sharing race and cgo-disabled cache keys.
inputs:
  go-version:
    description: Go version or version range supported by actions/setup-go.
    required: true
  cache-scope:
    description: Build mode and job role used to isolate cache entries.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: ${{ inputs.go-version }}
        # Cache ownership is explicit below; do not also restore the default key.
        cache: false
    - name: Locate Go caches
      id: go-env
      shell: bash
      run: |
        printf 'version=%s\n' "$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
        printf 'build=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - name: Restore Go module and build caches
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ${{ steps.go-env.outputs.build }}
          ${{ steps.go-env.outputs.modules }}
        key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-env.outputs.version }}-${{ inputs.cache-scope }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-env.outputs.version }}-${{ inputs.cache-scope }}-${{ hashFiles('go.mod', 'go.sum') }}-
          go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-env.outputs.version }}-${{ inputs.cache-scope }}-
